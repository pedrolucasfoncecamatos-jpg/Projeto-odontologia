<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar ou Cadastrar - Dr. Wilson Guedes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { dental: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#06b6d4', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <header id="appHeader" class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm"></header>

    <main class="max-w-md mx-auto px-4 py-14 w-full">
        <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200">
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tabPatient" class="flex-1 pb-3 text-sm font-bold text-dental-600 border-b-2 border-dental-600">
                    <i class="fa-solid fa-user-injured mr-1.5"></i>Paciente
                </button>
                <button id="tabDentist" class="flex-1 pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600">
                    <i class="fa-solid fa-user-doctor mr-1.5"></i>Dentista
                </button>
            </div>

            <!-- PACIENTE -->
            <div id="patientForms">
                <div class="flex justify-between items-center mb-6">
                    <h1 id="patientModalTitle" class="text-xl font-extrabold text-slate-900">Entrar como Paciente</h1>
                    <button id="togglePatientModeBtn" type="button" class="text-xs font-semibold text-dental-600 hover:underline">
                        Não tem conta? Cadastre-se
                    </button>
                </div>

                <form id="patientAuthForm" class="space-y-4">
                    <div id="patientNameField" class="hidden">
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nome Completo</label>
                        <input type="text" id="patientNameInput" placeholder="Seu nome" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail</label>
                        <input type="email" id="patientEmailInput" required placeholder="seuemail@exemplo.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Senha</label>
                        <input type="password" id="patientPasswordInput" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm">
                    </div>
                    <button type="submit" id="patientSubmitBtn" class="w-full py-3.5 bg-dental-600 hover:bg-dental-700 text-white font-bold rounded-xl shadow-lg shadow-dental-600/30 transition-all text-sm mt-2">
                        Entrar na Conta
                    </button>
                </form>
            </div>

            <!-- DENTISTA -->
            <div id="dentistForm" class="hidden">
                <div class="mb-6">
                    <h2 class="text-xl font-extrabold text-slate-900">Acesso Restrito - Dentista</h2>
                    <p class="text-xs text-slate-500 mt-1">Informe seu CRO e Senha cadastrada.</p>
                </div>

                <form id="dentistAuthForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">CRO (Nº Registro)</label>
                        <input type="text" id="dentistCroInput" required placeholder="Ex: 01341" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Senha</label>
                        <input type="password" id="dentistPasswordInput" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm">
                    </div>
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-500">
                        <i class="fa-solid fa-circle-info text-dental-600 mr-1"></i>
                        Credenciais: CRO <strong>01341</strong> | Senha <strong>Wilson123@</strong>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transition-all text-sm mt-2">
                        Acessar Painel do Dentista
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <p>&copy; 2026 Consultório Odontológico Dr. Wilson de Jesus Guedes Matos.</p>
            <p class="text-slate-500">CRO: 01341 | São Luís - MA</p>
        </div>
    </footer>

    <script type="module">
        import { renderizarCabecalho } from '../visoens/cabeçalho.js';
        import { iniciarControleAutenticacao } from '../controles/ControleAutenticação.js';
        renderizarCabecalho();
        iniciarControleAutenticacao();
    </script>
</body>
</html>
