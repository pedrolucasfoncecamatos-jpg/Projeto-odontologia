<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços & Tabela - Dr. Wilson Guedes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { dental: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#06b6d4', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <header id="appHeader" class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm"></header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 w-full">
        <div class="text-center mb-12">
            <span class="text-xs font-bold uppercase tracking-wider text-dental-600">Catálogo de Tratamentos</span>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mt-1">Procedimentos & Tabela de Preços</h1>
            <p class="text-slate-500 mt-2">Transparência e valores acessíveis para a sua saúde bucal. Selecione um procedimento para agendar.</p>
        </div>

        <div id="servicesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="bg-slate-950 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <p>&copy; 2026 Consultório Odontológico Dr. Wilson de Jesus Guedes Matos.</p>
            <p class="text-slate-500">CRO: 01341 | São Luís - MA</p>
        </div>
    </footer>

    <script type="module">
        import { renderizarCabecalho } from '../visoens/cabeçalho.js';
        import { iniciarControleServicos } from '../controles/controleServiço.js';
        renderizarCabecalho('servicos');
        iniciarControleServicos();
    </script>
</body>
</html>
